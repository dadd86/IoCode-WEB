name: iocode-solutions-production

services:
  app:
    image: "${APP_IMAGE:?APP_IMAGE debe ser una referencia OCI con digest sha256}"
    pull_policy: always
    init: true
    user: "1000:1000"
    environment:
      NODE_ENV: production
      PORT: "8080"
      ASTRO_TELEMETRY_DISABLED: "1"
      ENABLE_HSTS: "false"
      ENABLE_COOP: "false"
      ENABLE_UPGRADE_INSECURE_REQUESTS: "true"
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=1000,gid=1000
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 0.50
    mem_limit: 256m
    mem_reservation: 64m
    pids_limit: 100
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('node:http').get('http://127.0.0.1:8080/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - origin

  edge:
    image: "${NGINX_IMAGE:?NGINX_IMAGE debe ser una referencia OCI con digest sha256}"
    pull_policy: always
    init: true
    user: "101:101"
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:8080"
      - "443:8443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
    secrets:
      - tls_fullchain
      - tls_privkey
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,uid=101,gid=101
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 0.50
    mem_limit: 128m
    mem_reservation: 32m
    pids_limit: 100
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q --spider http://127.0.0.1:8080/nginx-health || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - origin

networks:
  origin:
    internal: true

secrets:
  tls_fullchain:
    file: "${TLS_FULLCHAIN_PATH:?Define TLS_FULLCHAIN_PATH}"
  tls_privkey:
    file: "${TLS_PRIVKEY_PATH:?Define TLS_PRIVKEY_PATH}"
