name: Publication gate - BLOCKED-BY-X-LEGAL

on:
  pull_request:
  push:
    branches:
      - master
      - carmonita
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publication-gate:
    name: Publication gate - BLOCKED-BY-X-LEGAL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PUBLIC_DEPLOY_ENV: production
      PUBLIC_SITE_URL: https://iocode-solutions.com
      PUBLIC_LEGAL_APPROVED: ${{ vars.PUBLIC_LEGAL_APPROVED }}
      PUBLIC_PRIVACY_APPROVED: ${{ vars.PUBLIC_PRIVACY_APPROVED }}
      PUBLIC_PRIVACY_AUTHORITY_NAME: ${{ vars.PUBLIC_PRIVACY_AUTHORITY_NAME }}
      PUBLIC_PRIVACY_AUTHORITY_URL: ${{ vars.PUBLIC_PRIVACY_AUTHORITY_URL }}
      PUBLIC_HOSTING_PROVIDER: ${{ vars.PUBLIC_HOSTING_PROVIDER }}
      PUBLIC_HOSTING_LOCATION: ${{ vars.PUBLIC_HOSTING_LOCATION }}
      PUBLIC_HOSTING_TRANSFER_SAFEGUARD: ${{ vars.PUBLIC_HOSTING_TRANSFER_SAFEGUARD }}
      PUBLIC_EMAIL_PROVIDER: ${{ vars.PUBLIC_EMAIL_PROVIDER }}
      PUBLIC_EMAIL_LOCATION: ${{ vars.PUBLIC_EMAIL_LOCATION }}
      PUBLIC_EMAIL_TRANSFER_SAFEGUARD: ${{ vars.PUBLIC_EMAIL_TRANSFER_SAFEGUARD }}
      PUBLIC_DNS_PROVIDER: ${{ vars.PUBLIC_DNS_PROVIDER }}
      PUBLIC_DNS_LOCATION: ${{ vars.PUBLIC_DNS_LOCATION }}
      PUBLIC_DNS_TRANSFER_SAFEGUARD: ${{ vars.PUBLIC_DNS_TRANSFER_SAFEGUARD }}
      PUBLIC_REGISTRAR_PROVIDER: ${{ vars.PUBLIC_REGISTRAR_PROVIDER }}
      PUBLIC_REGISTRAR_LOCATION: ${{ vars.PUBLIC_REGISTRAR_LOCATION }}
      PUBLIC_REGISTRAR_TRANSFER_SAFEGUARD: ${{ vars.PUBLIC_REGISTRAR_TRANSFER_SAFEGUARD }}
      PRIVACY_DENYLIST_CONTENT: ${{ secrets.PRIVACY_DENYLIST_CONTENT }}
      PRIVACY_DENYLIST_REQUIRED: "1"
      ASTRO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
      - name: Use locked Node runtime
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Locked install
        run: npm ci
      - name: Static and unit checks
        run: |
          npm run check
          npm run internal:typecheck:src
          npm run internal:typecheck:tests
          npm run internal:env:test
          npm run internal:docs:test
          npm run internal:qa:privacy
          node --test tests/unit/ci-gate-separation.test.mjs
          node --test tests/unit/phase-9a-contract.test.mjs
      - name: Production build and leak gate
        run: |
          npm run build
          npm run internal:qa:privacy
          npm run internal:qa:config:prod
          npm run internal:qa:phase-9b:static
          npm run internal:qa:phase-9c:static
          npm run internal:qa:phase-9f:static
          npm run internal:validate:dist-sitemap
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Responsive, SEO and WCAG browser gate
        run: |
          node Docker/node-static-server.mjs &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          export PLAYWRIGHT_BASE_URL=http://127.0.0.1:8080
          for attempt in {1..30}; do
            curl --fail --silent http://127.0.0.1:8080/health >/dev/null && break
            sleep 0.25
          done
          curl --fail --silent http://127.0.0.1:8080/health >/dev/null
          npm run internal:qa:phase-9b:e2e
          npm run internal:qa:phase-9c:e2e
          npm run internal:qa:phase-9d:flaky
          npm run internal:qa:phase-9f:e2e
      - name: Production HTTP contract gate
        run: npm run internal:qa:phase-9d:http
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Package static artifact
        run: |
          source_date_epoch="$(git show -s --format=%ct HEAD)"
          tar --sort=name --mtime="@${source_date_epoch}" --owner=0 --group=0 --numeric-owner -C dist -czf "iocode-dist-${GITHUB_SHA}.tar.gz" .
          echo "ARTIFACT_SHA256=$(sha256sum "iocode-dist-${GITHUB_SHA}.tar.gz" | cut -d' ' -f1)" >> "$GITHUB_ENV"
      - name: Build immutable OCI image
        run: |
          release_version="$(node -p "require('./package.json').version")"
          docker build \
            --build-arg PUBLIC_DEPLOY_ENV=production \
            --build-arg PUBLIC_SITE_URL=https://iocode-solutions.com \
            --build-arg PUBLIC_LEGAL_APPROVED="${PUBLIC_LEGAL_APPROVED}" \
            --build-arg PUBLIC_PRIVACY_APPROVED="${PUBLIC_PRIVACY_APPROVED}" \
            --build-arg PUBLIC_PRIVACY_AUTHORITY_NAME="${PUBLIC_PRIVACY_AUTHORITY_NAME}" \
            --build-arg PUBLIC_PRIVACY_AUTHORITY_URL="${PUBLIC_PRIVACY_AUTHORITY_URL}" \
            --build-arg PUBLIC_HOSTING_PROVIDER="${PUBLIC_HOSTING_PROVIDER}" \
            --build-arg PUBLIC_HOSTING_LOCATION="${PUBLIC_HOSTING_LOCATION}" \
            --build-arg PUBLIC_HOSTING_TRANSFER_SAFEGUARD="${PUBLIC_HOSTING_TRANSFER_SAFEGUARD}" \
            --build-arg PUBLIC_EMAIL_PROVIDER="${PUBLIC_EMAIL_PROVIDER}" \
            --build-arg PUBLIC_EMAIL_LOCATION="${PUBLIC_EMAIL_LOCATION}" \
            --build-arg PUBLIC_EMAIL_TRANSFER_SAFEGUARD="${PUBLIC_EMAIL_TRANSFER_SAFEGUARD}" \
            --build-arg PUBLIC_DNS_PROVIDER="${PUBLIC_DNS_PROVIDER}" \
            --build-arg PUBLIC_DNS_LOCATION="${PUBLIC_DNS_LOCATION}" \
            --build-arg PUBLIC_DNS_TRANSFER_SAFEGUARD="${PUBLIC_DNS_TRANSFER_SAFEGUARD}" \
            --build-arg PUBLIC_REGISTRAR_PROVIDER="${PUBLIC_REGISTRAR_PROVIDER}" \
            --build-arg PUBLIC_REGISTRAR_LOCATION="${PUBLIC_REGISTRAR_LOCATION}" \
            --build-arg PUBLIC_REGISTRAR_TRANSFER_SAFEGUARD="${PUBLIC_REGISTRAR_TRANSFER_SAFEGUARD}" \
            --build-arg RELEASE_VERSION="${release_version}" \
            --build-arg VCS_REF="${GITHUB_SHA}" \
            --build-arg BUILD_DATE="$(git show -s --format=%cI HEAD)" \
            --build-arg ARTIFACT_NAME="iocode-dist-${GITHUB_SHA}.tar.gz" \
            --build-arg ARTIFACT_SHA256="${ARTIFACT_SHA256}" \
            --tag "ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/iocode-solutions:${GITHUB_SHA}" \
            --file Docker/Dockerfile .
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push release image and capture digest
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/master'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/iocode-solutions:${GITHUB_SHA}"
          docker push "$image"
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$image" | cut -d@ -f2)"
          test -n "$digest"
          echo "IMAGE_DIGEST=$digest" >> "$GITHUB_ENV"
      - name: Create traceability manifest
        run: node tools/create-release-manifest.mjs --artifact "iocode-dist-${GITHUB_SHA}.tar.gz" --artifact-sha256 "${ARTIFACT_SHA256}" --image-digest "${IMAGE_DIGEST:-}" --output release-manifest.json
      - name: Upload immutable release evidence
        uses: actions/upload-artifact@v4
        with:
          name: iocode-release-${{ github.sha }}
          path: |
            iocode-dist-${{ github.sha }}.tar.gz
            release-manifest.json
          if-no-files-found: error
          retention-days: 30
