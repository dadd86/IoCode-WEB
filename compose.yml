name: iocode-solutions

services:
  dev:
    container_name: iocode-solutions-dev
    build:
      context: .
      dockerfile: Docker/Dockerfile.dev
    init: true
    environment:
      NODE_ENV: development
      ASTRO_TELEMETRY_DISABLED: "1"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${ASTRO_DEV_PORT:-4321}:4321"
    volumes:
      - .:/app
      - iocode_node_modules:/app/node_modules
      - iocode_astro_cache:/app/.astro
    command: >
      sh -c "
      if [ ! -d node_modules/astro ]; then
        if [ -f package-lock.json ]; then npm ci; else npm install; fi;
      fi;
      npm run dev -- --host 0.0.0.0
      "
    restart: unless-stopped

  qa:
    container_name: iocode-solutions-qa
    build:
      context: .
      dockerfile: Docker/Dockerfile.dev
    init: true
    environment:
      NODE_ENV: development
      ASTRO_TELEMETRY_DISABLED: "1"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - .:/app
      - iocode_node_modules:/app/node_modules
      - iocode_astro_cache:/app/.astro
    command: >
      sh -c "
      if [ ! -d node_modules/astro ]; then
        if [ -f package-lock.json ]; then npm ci; else npm install; fi;
      fi;
      node --version &&
      npm --version &&
      npm run qa
      "
    profiles:
      - qa

  preview:
    container_name: iocode-solutions-preview
    build:
      context: .
      dockerfile: Docker/Dockerfile.dev
    init: true
    environment:
      NODE_ENV: production
      ASTRO_TELEMETRY_DISABLED: "1"
    ports:
      - "${ASTRO_PREVIEW_PORT:-4322}:4321"
    volumes:
      - .:/app
      - iocode_node_modules:/app/node_modules
      - iocode_astro_cache:/app/.astro
    command: >
      sh -c "
      if [ ! -d node_modules/astro ]; then
        if [ -f package-lock.json ]; then npm ci; else npm install; fi;
      fi;
      node --version &&
      npm --version &&
      npm run build &&
      npm run preview -- --host 0.0.0.0 --port 4321
      "
    profiles:
      - preview

  web:
    container_name: iocode-solutions-web
    build:
      context: .
      dockerfile: Docker/Dockerfile
    init: true
    environment:
      NODE_ENV: production
      PORT: "8080"
      ASTRO_TELEMETRY_DISABLED: "1"
      ENABLE_HSTS: "false"
      ENABLE_UPGRADE_INSECURE_REQUESTS: "false"
    ports:
      - "${WEB_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:http').get('http://127.0.0.1:8080/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    profiles:
      - prod

  browser-qa:
    container_name: iocode-solutions-browser-qa
    build:
      context: .
      dockerfile: Docker/Dockerfile.browser-qa
      args:
        PLAYWRIGHT_VERSION: "1.60.0"
    init: true
    environment:
      CI: "1"
      ASTRO_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_BASE_URL: "http://web:8080"
      LIGHTHOUSE_BASE_URL: "http://web:8080"
      LH_MIN_PERFORMANCE: "0.50"
      LH_MIN_ACCESSIBILITY: "0.90"
      LH_MIN_BEST_PRACTICES: "0.85"
      LH_MIN_SEO: "0.90"
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./qa-artifacts:/app/qa-artifacts
    profiles:
      - qa

volumes:
  iocode_node_modules:
  iocode_astro_cache: