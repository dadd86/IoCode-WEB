name: iocode-solutions

services:
  dev:
    container_name: iocode-solutions-dev
    build:
      context: .
      dockerfile: Docker/Dockerfile.dev
    init: true
    environment:
      NODE_ENV: development
      ASTRO_TELEMETRY_DISABLED: "1"
      CHOKIDAR_USEPOLLING: "${CHOKIDAR_USEPOLLING:-false}"
    ports:
      - "${ASTRO_DEV_PORT:-4321}:4321"
    volumes:
      - .:/app
      - iocode_node_modules:/app/node_modules
      - iocode_astro_cache:/app/.astro
    command: npm run dev -- --host 0.0.0.0
    restart: unless-stopped

  qa:
    container_name: iocode-solutions-qa
    build:
      context: .
      dockerfile: Docker/Dockerfile.dev
    init: true
    environment:
      NODE_ENV: development
      ASTRO_TELEMETRY_DISABLED: "1"
      PUBLIC_DEPLOY_ENV: "production"
      PUBLIC_SITE_URL: "https://iocode-solutions.com"
      PUBLIC_LEGAL_APPROVED: "${PUBLIC_LEGAL_APPROVED:-false}"
      PUBLIC_PRIVACY_APPROVED: "${PUBLIC_PRIVACY_APPROVED:-false}"
      PUBLIC_PRIVACY_AUTHORITY_NAME: "${PUBLIC_PRIVACY_AUTHORITY_NAME:-}"
      PUBLIC_PRIVACY_AUTHORITY_URL: "${PUBLIC_PRIVACY_AUTHORITY_URL:-}"
      PUBLIC_HOSTING_PROVIDER: "${PUBLIC_HOSTING_PROVIDER:-}"
      PUBLIC_HOSTING_LOCATION: "${PUBLIC_HOSTING_LOCATION:-}"
      PUBLIC_HOSTING_TRANSFER_SAFEGUARD: "${PUBLIC_HOSTING_TRANSFER_SAFEGUARD:-}"
      PUBLIC_EMAIL_PROVIDER: "${PUBLIC_EMAIL_PROVIDER:-}"
      PUBLIC_EMAIL_LOCATION: "${PUBLIC_EMAIL_LOCATION:-}"
      PUBLIC_EMAIL_TRANSFER_SAFEGUARD: "${PUBLIC_EMAIL_TRANSFER_SAFEGUARD:-}"
      PUBLIC_DNS_PROVIDER: "${PUBLIC_DNS_PROVIDER:-}"
      PUBLIC_DNS_LOCATION: "${PUBLIC_DNS_LOCATION:-}"
      PUBLIC_DNS_TRANSFER_SAFEGUARD: "${PUBLIC_DNS_TRANSFER_SAFEGUARD:-}"
      PUBLIC_REGISTRAR_PROVIDER: "${PUBLIC_REGISTRAR_PROVIDER:-}"
      PUBLIC_REGISTRAR_LOCATION: "${PUBLIC_REGISTRAR_LOCATION:-}"
      PUBLIC_REGISTRAR_TRANSFER_SAFEGUARD: "${PUBLIC_REGISTRAR_TRANSFER_SAFEGUARD:-}"
      CHOKIDAR_USEPOLLING: "${CHOKIDAR_USEPOLLING:-false}"
    volumes:
      - .:/app
      - iocode_node_modules:/app/node_modules
      - iocode_astro_cache:/app/.astro
    command: >
      sh -c "
      node --version &&
      npm --version &&
      npm run internal:qa
      "
    profiles:
      - qa

  preview:
    container_name: iocode-solutions-preview
    build:
      context: .
      dockerfile: Docker/Dockerfile.dev
    init: true
    environment:
      NODE_ENV: production
      ASTRO_TELEMETRY_DISABLED: "1"
      PUBLIC_DEPLOY_ENV: "preview"
      PUBLIC_SITE_URL: "${PREVIEW_SITE_URL:-https://preview.example.net}"
    ports:
      - "${ASTRO_PREVIEW_PORT:-4322}:4321"
    volumes:
      - .:/app
      - iocode_node_modules:/app/node_modules
      - iocode_astro_cache:/app/.astro
    command: >
      sh -c "
      node --version &&
      npm --version &&
      npm run build:preview &&
      npm run preview -- --host 0.0.0.0 --port 4321
      "
    profiles:
      - preview

  web:
    container_name: iocode-solutions-web
    build:
      context: .
      dockerfile: Docker/Dockerfile
      args:
        PUBLIC_DEPLOY_ENV: "${PUBLIC_DEPLOY_ENV:-production}"
        PUBLIC_SITE_URL: "${PUBLIC_SITE_URL:-https://iocode-solutions.com}"
        PUBLIC_LEGAL_APPROVED: "${PUBLIC_LEGAL_APPROVED:-false}"
        PUBLIC_PRIVACY_APPROVED: "${PUBLIC_PRIVACY_APPROVED:-false}"
        PUBLIC_PRIVACY_AUTHORITY_NAME: "${PUBLIC_PRIVACY_AUTHORITY_NAME:-}"
        PUBLIC_PRIVACY_AUTHORITY_URL: "${PUBLIC_PRIVACY_AUTHORITY_URL:-}"
        PUBLIC_HOSTING_PROVIDER: "${PUBLIC_HOSTING_PROVIDER:-}"
        PUBLIC_HOSTING_LOCATION: "${PUBLIC_HOSTING_LOCATION:-}"
        PUBLIC_HOSTING_TRANSFER_SAFEGUARD: "${PUBLIC_HOSTING_TRANSFER_SAFEGUARD:-}"
        PUBLIC_EMAIL_PROVIDER: "${PUBLIC_EMAIL_PROVIDER:-}"
        PUBLIC_EMAIL_LOCATION: "${PUBLIC_EMAIL_LOCATION:-}"
        PUBLIC_EMAIL_TRANSFER_SAFEGUARD: "${PUBLIC_EMAIL_TRANSFER_SAFEGUARD:-}"
        PUBLIC_DNS_PROVIDER: "${PUBLIC_DNS_PROVIDER:-}"
        PUBLIC_DNS_LOCATION: "${PUBLIC_DNS_LOCATION:-}"
        PUBLIC_DNS_TRANSFER_SAFEGUARD: "${PUBLIC_DNS_TRANSFER_SAFEGUARD:-}"
        PUBLIC_REGISTRAR_PROVIDER: "${PUBLIC_REGISTRAR_PROVIDER:-}"
        PUBLIC_REGISTRAR_LOCATION: "${PUBLIC_REGISTRAR_LOCATION:-}"
        PUBLIC_REGISTRAR_TRANSFER_SAFEGUARD: "${PUBLIC_REGISTRAR_TRANSFER_SAFEGUARD:-}"
    init: true
    environment:
      NODE_ENV: production
      PORT: "8080"
      ASTRO_TELEMETRY_DISABLED: "1"
      ENABLE_HSTS: "${ENABLE_HSTS:-false}"
      ENABLE_UPGRADE_INSECURE_REQUESTS: "${ENABLE_UPGRADE_INSECURE_REQUESTS:-false}"
      ENABLE_COOP: "${ENABLE_COOP:-false}"
    ports:
      - "${WEB_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cpus: 0.50
    mem_limit: 256m
    mem_reservation: 64m
    pids_limit: 100
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:http').get('http://127.0.0.1:8080/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    profiles:
      - prod

  browser-qa:
    container_name: iocode-solutions-browser-qa
    build:
      context: .
      dockerfile: Docker/Dockerfile.browser-qa
      args:
        PLAYWRIGHT_VERSION: "1.60.0"
    init: true
    environment:
      CI: "1"
      ASTRO_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_BASE_URL: "http://web:8080"
      LIGHTHOUSE_BASE_URL: "http://web:8080"
      SECURITY_BASE_URL: "http://web:8080"
      DEVOPS_BASE_URL: "http://web:8080"
      LH_MIN_PERFORMANCE: "0.50"
      LH_MIN_ACCESSIBILITY: "1"
      LH_MIN_BEST_PRACTICES: "0.85"
      LH_MIN_SEO: "1"
      A11Y_PERF_BASE_URL: "http://web:8080"
      A11Y_PERF_LIGHTHOUSE_BASE_URL: "http://web:8080"
      A11Y_PERF_MAX_JS_BYTES: "700000"
      A11Y_PERF_MAX_CSS_BYTES: "120000"
      A11Y_PERF_MAX_GLB_BYTES: "8000000"
      A11Y_PERF_MAX_IMAGE_BYTES: "2000000"
      A11Y_PERF_MIN_ACCESSIBILITY: "1"
      A11Y_PERF_MIN_SEO: "1"
      A11Y_PERF_MIN_BEST_PRACTICES: "0.95"
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./qa-artifacts:/app/qa-artifacts
    profiles:
      - qa

  performance-qa:
    container_name: iocode-solutions-performance-qa
    build:
      context: .
      dockerfile: Docker/Dockerfile.performance
      args:
        PLAYWRIGHT_IMAGE: "mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948"
    init: true
    environment:
      CI: "1"
      ASTRO_TELEMETRY_DISABLED: "1"
      PLAYWRIGHT_BASE_URL: "http://web:8080"
      LIGHTHOUSE_BASE_URL: "http://web:8080"
      PERFORMANCE_BASE_URL: "http://web:8080"
      CHROME_PATH: "/usr/local/bin/chromium"

      PHASE6_MAX_GLB_IDEAL_BYTES: "250000"
      PHASE6_MAX_GLB_ACCEPTED_BYTES: "500000"
      PHASE6_MAX_GLB_BLOCKER_BYTES: "500000"

      PHASE6_MAX_IMAGE_BYTES: "350000"
      PHASE6_MAX_CRITICAL_LOGO_BYTES: "180000"
      PHASE6_MAX_SMALL_LOGO_BYTES: "90000"
      PHASE6_MAX_JS_INITIAL_BYTES: "250000"
      PHASE6_MAX_JS_TOTAL_BYTES: "700000"
      PHASE6_MAX_CSS_TOTAL_BYTES: "120000"
      PHASE6_MAX_HERO_LOADER_INITIAL_BYTES: "12000"
      PHASE6_MAX_HERO_LOADER_INITIAL_GZIP_BYTES: "5000"
      PHASE6_MAX_THREE_RUNTIME_GZIP_BYTES: "190000"

      PHASE6_MIN_LIGHTHOUSE_DESKTOP: "0.90"
      PHASE6_MIN_LIGHTHOUSE_MOBILE: "0.75"
      PHASE6_MAX_LCP_MS: "2500"
      PHASE6_MAX_CLS: "0.1"
      PHASE6_MAX_TBT_MS: "300"
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./qa-artifacts:/app/qa-artifacts
    profiles:
      - qa

  release-tools:
    container_name: iocode-solutions-release-tools
    build:
      context: .
      dockerfile: Docker/Dockerfile.dev
    init: true
    working_dir: /app
    environment:
      NODE_ENV: development
      ASTRO_TELEMETRY_DISABLED: "1"
    volumes:
      - .:/app
    entrypoint:
      - sh
      - -lc
    command: "node --version && npm --version && git --version && unzip -v | head -1"
    profiles:
      - release

  assets:
    container_name: iocode-solutions-assets
    build:
      context: .
      dockerfile: Docker/Dockerfile.performance
      args:
        PLAYWRIGHT_IMAGE: "mcr.microsoft.com/playwright:v1.60.0-noble@sha256:9bd26ad900bb5e0f4dee75839e957a89ae89c2b7ab1e76050e559790e946b948"
    init: true
    working_dir: /app
    environment:
      CI: "1"
      ASTRO_TELEMETRY_DISABLED: "1"
      CHROME_PATH: "/usr/local/bin/chromium"
    volumes:
      - .:/app
      - iocode_performance_node_modules:/app/node_modules
    entrypoint:
      - sh
      - -lc
    command: "node --version && npm --version && ./node_modules/.bin/gltf-transform --version"
    profiles:
      - assets
volumes:
  iocode_node_modules:
  iocode_astro_cache:
  iocode_performance_node_modules:
