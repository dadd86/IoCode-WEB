limit_req_zone $binary_remote_addr zone=site_per_ip:10m rate=20r/s;

upstream iocode_origin {
  server app:8080;
  keepalive 16;
}

server {
  listen 8080 default_server;
  server_name iocode-solutions.com www.iocode-solutions.com;

  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    return 308 https://iocode-solutions.com$request_uri;
  }
}

server {
  listen 8443 ssl;
  http2 on;
  server_name www.iocode-solutions.com;

  ssl_certificate /run/secrets/tls_fullchain;
  ssl_certificate_key /run/secrets/tls_privkey;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:TLS:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  return 308 https://iocode-solutions.com$request_uri;
}

server {
  listen 8443 ssl default_server;
  http2 on;
  server_name iocode-solutions.com;

  ssl_certificate /run/secrets/tls_fullchain;
  ssl_certificate_key /run/secrets/tls_privkey;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_session_cache shared:TLS:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=()" always;

  location = /nginx-health {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  location / {
    limit_req zone=site_per_ip burst=40 nodelay;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Accept-Encoding $http_accept_encoding;
    proxy_pass http://iocode_origin;
  }
}
